# 生产环境覆盖文件：在 compose.yml 基础上增加 Caddy（自动申请并续期 HTTPS 证书）
#
# 使用方式：
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# 前提：.env 中 DOMAIN 已填写，SITE_URL 已改为 https://<DOMAIN>，域名 A/AAAA 记录已指向服务器。

name: home

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请先在 .env 中设置 DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ghost

volumes:
  caddy_data:
  caddy_config:
