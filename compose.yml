# Ghost 6 + MySQL 8 —— 与 felixrieseberg.com 相同的技术栈
#
# 本地启动：docker compose up -d
# 启动后访问：http://localhost:2368（前台）/ http://localhost:2368/ghost/（后台）

name: home

services:
  ghost:
    image: ghost:${GHOST_VERSION:-6-alpine}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      url: ${SITE_URL:-http://localhost:2368}
      database__client: mysql
      database__connection__host: db
      database__connection__user: ${DATABASE_USER:-ghost}
      database__connection__password: ${DATABASE_PASSWORD:?请在 .env 中设置 DATABASE_PASSWORD}
      database__connection__database: ghost
    ports:
      # 只绑定本机回环地址。生产环境由 Caddy 通过内部网络访问，不需要对外暴露此端口。
      - "127.0.0.1:${GHOST_PORT:-2368}:2368"
    volumes:
      # 上传的图片、主题等持久化数据
      - ghost_content:/var/lib/ghost/content
      # 主题源码目录单独挂载，改完文件后重启 Ghost 即可生效
      - ./themes/home:/var/lib/ghost/content/themes/home
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2368/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  db:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?请在 .env 中设置 DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER:-ghost}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?请在 .env 中设置 DATABASE_PASSWORD}
      MYSQL_DATABASE: ghost
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  ghost_content:
  mysql_data:
